spring:
  application:
    name: Articket2-test
  datasource:
    url: jdbc:h2:mem:articket2;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
    show-sql: false
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: true
  mail:
    host: localhost
  task:
    scheduling:
      enabled: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

jwt:
  secret: c29tZVNlY3VyZUtleVRleHRUZXh0VGV4dFRleHRUZXh0VGV4dFRleHRUZXh0
